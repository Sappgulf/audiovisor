name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test & coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run size

      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke (every mode, panel and shortcut)
        run: npm run e2e
