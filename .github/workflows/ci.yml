name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The PWA and service-worker suites assert against dist/, so the build
      # has to exist before the tests run.
      - name: Build
        run: npm run build

      - name: Test & coverage
        run: npm run coverage

      - name: Bundle budget
        run: npm run size
