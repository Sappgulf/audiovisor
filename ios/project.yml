name: AudioVisor
options:
  bundleIdPrefix: app.audiovisor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "9.0.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: FW6FWBCF5U
    CODE_SIGN_STYLE: Automatic
targets:
  AudioVisor:
    type: application
    platform: iOS
    sources:
      - path: AudioVisor
        excludes: ["Web/**", "VisualPreviews/**"]
      - path: AudioVisor/VisualPreviews
        type: folder
        buildPhase: resources
      - path: AudioVisor/Web
        type: folder
        optional: true
        buildPhase: resources
    info:
      path: AudioVisor/Info.plist
      properties:
        CFBundleDisplayName: Audiovisor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: AUDIOVISOR listens to the room so the visuals can react to live music. Audio is analysed on your device and never recorded or sent anywhere.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.audiovisor.ios
        INFOPLIST_KEY_UIStatusBarHidden: YES
  AudioVisorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AudioVisorTests]
    dependencies:
      - target: AudioVisor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.audiovisor.ios.tests
  AudioVisorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AudioVisorUITests]
    dependencies:
      - target: AudioVisor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.audiovisor.ios.uitests
schemes:
  AudioVisor:
    build:
      targets:
        AudioVisor: all
        AudioVisorTests: [test]
        AudioVisorUITests: [test]
    test:
      targets: [AudioVisorTests, AudioVisorUITests]
